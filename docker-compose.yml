version: '3.8'

services:
  nemesis-server:
    image: nemesis-server:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${NEMESIS_API_PORT:-18080}:18080"
      # 17001은 에이전트 수신 포트(서버는 아웃바운드만 사용) — 서버 매핑은 잘못된 설계라 제거.
      # 매핑 시 docker-proxy가 호스트 17001을 점유해 같은 호스트의 에이전트가 바인드 불가.
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    # 호스트의 Ollama(11434)에 host.docker.internal 로 도달.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # 에이전트 설치 마법사(AgentInstallService)가 SCP로 배포할 소스 파일 위치.
      # nemesis.agent.files-dir 기본값과 동일한 절대경로로 마운트해야 한다.
      - ./agent:/var/www/html/Nemesis_v100/agent:ro
    networks:
      - nemesis-net

  nemesis-server-02:
    image: nemesis-server:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${NEMESIS_API_PORT_02:-18081}:18080"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./agent:/var/www/html/Nemesis_v100/agent:ro
    networks:
      - nemesis-net

  # AI 사이드카(/ai/* — 채팅·진단)는 docker-compose로 관리하지 않음.
  # 실제 운영은 systemd nemesis-sidecar.service(/opt/nemesis-bot, 포트 18900, host.docker.internal 경유
  # 또는 도커 브릿지 게이트웨이로 백엔드가 호출)로 별도 기동한다. 상세: docs 또는 NEMESIS_AIBOT_URL 참고.

  nemesis-frontend:
    image: nginx:alpine
    ports:
      - "${NEMESIS_UI_PORT:-18090}:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - nemesis-server
    networks:
      - nemesis-net

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-nemesis}
      POSTGRES_USER: ${DB_USER:-nemesis}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - nemesis-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nemesis}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nemesis-net

volumes:
  nemesis-data:

networks:
  nemesis-net:
    driver: bridge
