<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEMESIS Monitoring Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Material-3 스타일 토큰 정의(다크 테마). 이 설정이 없으면
    // bg-surface-container / border-surface-variant / text-on-surface / font-display
    // 클래스가 무효가 되어 카드가 투명하게 렌더링된다.
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'surface-container': '#161b22',
            'surface-variant':   '#2d333b',
            'on-surface':        '#e5e7eb',
          },
          fontFamily: {
            display: ['Noto Sans KR', 'Segoe UI', 'sans-serif'],
          },
        },
      },
    }
  </script>
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #111827; }
    ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #4b5563; }
    body {
      background-color: #0b0e14;
      color: #e5e7eb;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto,
        'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR',
        'Malgun Gothic', sans-serif;
    }
    .card-bg { background-color: #161b22; border: 1px solid #2d333b; }
    .sidebar-bg { background-color: #0d1117; border-right: 1px solid #2d333b; }
    .status-green  { color: #4ade80; }
    .status-orange { color: #fbbf24; }
    .status-red    { color: #f87171; }
    .status-blue   { color: #60a5fa; }

    /* 이중화 실시간 동기화: 데이터가 흐르는 듯한 무한 로딩 바 */
    @keyframes syncSlide {
      0%   { transform: translateX(-130%); }
      100% { transform: translateX(330%); }
    }
    .sync-bar-fill {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 32%;
      border-radius: 9999px;
      background: linear-gradient(90deg,
        rgba(74, 222, 128, 0) 0%,
        rgba(74, 222, 128, 0.95) 50%,
        rgba(74, 222, 128, 0) 100%);
      animation: syncSlide 1.3s ease-in-out infinite;
      will-change: transform;
    }
  </style>
  <script type="module" crossorigin src="/assets/index-CtSXqORY.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-Cz9sbuZz.css">
</head>
<body>
  <div id="root"></div>
</body>
</html>
